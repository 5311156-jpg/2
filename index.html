<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בקהילה - דשבורד מערכת</title>

<style>
  :root {
    --bg-color: #070707;
    --header-bg: rgba(10, 10, 10, 0.92);
    --accent-color: #ffcc00;
    --danger-color: #ff2a2a;
    --text-soft: #cfcfcf;
    --ticker-speed: 30s;

    /* גודל והתאמת השיטס */
    --sheet-scale: 0.67;
    --sheet-expand: 130%;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: white;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,0,0,0.10) 0%, rgba(255,0,0,0.02) 18%, rgba(0,0,0,0) 42%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 35%),
      linear-gradient(180deg, #121212 0%, #080808 100%);
  }

  .header {
    height: 120px;
    background: rgba(10, 10, 10, 0.92);
    backdrop-filter: blur(10px);
    display: grid;
    grid-template-columns: 260px 1fr 150px;
    align-items: center;
    gap: 20px;
    padding: 8px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
  }

  .brand-logo {
    max-width: 210px;
    max-height: 70px;
    object-fit: contain;
  }

  .center-zone {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .deadline-panel {
    width: min(900px, 100%);
    padding: 10px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.08);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)),
      linear-gradient(135deg, rgba(70,0,0,0.42), rgba(0,0,0,0.78));
  }

  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(95px, 1fr));
    gap: 8px;
  }

  .time-box {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 7px 6px 6px;
    text-align: center;
  }

  .time-value {
    font-family: Consolas, monospace;
    font-weight: 900;
    font-size: 42px;
    color: #fff;
  }

  .time-label {
    margin-top: 5px;
    font-size: 11px;
    color: var(--text-soft);
  }

  .header-right {
    display: flex;
    justify-content: flex-end;
  }

  .clock-box {
    min-width: 118px;
    padding: 7px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
  }

  .clock {
    font-family: Consolas, monospace;
    font-size: 28px;
    font-weight: 800;
    color: var(--accent-color);
  }

  .sheet-container {
    height: calc(100vh - 190px);
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }

  .sheet-frame {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: white;
  }

  .sheet-frame iframe {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--sheet-expand);
    height: var(--sheet-expand);
    border: none;
    background: white;
    transform: translateX(-50%) scale(var(--sheet-scale));
    transform-origin: top center;
  }

  .ticker-wrap {
    height: 70px;
    background: rgba(8,8,8,0.96);
    border-top: 1px solid rgba(255,255,255,0.06);
    position: fixed;
    bottom: 0;
    width: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    z-index: 20;
  }

  .ticker-label {
    background: #c40000;
    color: white;
    padding: 0 24px;
    height: 100%;
    display: flex;
    align-items: center;
    font-weight: 800;
    font-size: 22px;
    white-space: nowrap;
  }

  .ticker-nav {
    display: flex;
    white-space: nowrap;
    padding-right: 100%;
    animation: scroll-it var(--ticker-speed) linear infinite;
  }

  .news-item {
    display: flex;
    align-items: center;
    font-size: 26px;
    font-weight: 500;
    padding: 0 36px;
  }

  .news-time {
    color: var(--accent-color);
    font-weight: 800;
    margin-left: 12px;
    font-family: Consolas, monospace;
  }

  @keyframes scroll-it {
    0% { transform: translateX(0); }
    100% { transform: translateX(100%); }
  }
</style>
</head>

<body>

<div class="header">

  <div class="brand">
    <img
      class="brand-logo"
      src="לוגו בקהילה וקטורי.jpg"
      alt="בקהילה"
    >
  </div>

  <div class="center-zone">
    <div class="deadline-panel">

      <div class="countdown-grid">

        <div class="time-box">
          <div id="days" class="time-value">00</div>
          <div class="time-label">ימים</div>
        </div>

        <div class="time-box">
          <div id="hours" class="time-value">00</div>
          <div class="time-label">שעות</div>
        </div>

        <div class="time-box">
          <div id="minutes" class="time-value">00</div>
          <div class="time-label">דקות</div>
        </div>

        <div class="time-box">
          <div id="seconds" class="time-value">00</div>
          <div class="time-label">שניות</div>
        </div>

      </div>
    </div>
  </div>

  <div class="header-right">
    <div class="clock-box">
      <div id="clock" class="clock">00:00:00</div>
    </div>
  </div>

</div>

<div class="sheet-container">
  <div class="sheet-frame">

    <!-- השיטס המעודכן -->
    <iframe
      id="sheetFrame"
      src="https://docs.google.com/spreadsheets/d/1f7LRkcTDvvonP5Ea7F-mg2hozFyhbFDLtdC476h_kJI/preview?gid=1602259236">
    </iframe>

  </div>
</div>

<div class="ticker-wrap">

  <div class="ticker-label">
    מבזקי רוטר
  </div>

  <div id="ticker" class="ticker-nav">
    <span class="news-item">טוען מבזקים אחרונים...</span>
  </div>

</div>

<script>

const SHEET_BASE_URL =
"https://docs.google.com/spreadsheets/d/1f7LRkcTDvvonP5Ea7F-mg2hozFyhbFDLtdC476h_kJI/preview?gid=1602259236";

function pad(num) {
  return String(num).padStart(2, '0');
}

function updateClock() {

  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString('he-IL', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

}

function updateCountdown() {

  const targetDate = new Date('2026-05-06T15:00:00+03:00');

  const now = new Date();

  const diff = targetDate - now;

  if (diff <= 0) {
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const days = Math.floor(totalSeconds / 86400);

  const hours =
    Math.floor((totalSeconds % 86400) / 3600);

  const minutes =
    Math.floor((totalSeconds % 3600) / 60);

  const seconds =
    totalSeconds % 60;

  document.getElementById("days").innerText = pad(days);
  document.getElementById("hours").innerText = pad(hours);
  document.getElementById("minutes").innerText = pad(minutes);
  document.getElementById("seconds").innerText = pad(seconds);

}

function refreshSheet() {

  const iframe =
    document.getElementById("sheetFrame");

  iframe.src =
    SHEET_BASE_URL + "&t=" + Date.now();

}

async function loadNews() {

  const RSS_URL =
    "https://rotter.net/rss/rotternews.xml";

  const PROXY_URL =
    "https://corsproxy.io/?" +
    encodeURIComponent(
      RSS_URL + "?t=" + Date.now()
    );

  try {

    const response =
      await fetch(PROXY_URL);

    const buffer =
      await response.arrayBuffer();

    const decoder =
      new TextDecoder("windows-1255");

    const text =
      decoder.decode(buffer);

    const parser =
      new DOMParser();

    const xmlDoc =
      parser.parseFromString(text, "text/xml");

    const items =
      xmlDoc.querySelectorAll("item");

    let newsHtml = "";

    items.forEach((item, index) => {

      if (index < 15) {

        const title =
          item.querySelector("title")?.textContent || "";

        const pubDate =
          item.querySelector("pubDate")?.textContent || "";

        const dateObj =
          new Date(pubDate);

        const timeStr =
          isNaN(dateObj)
            ? ""
            : dateObj.toLocaleTimeString("he-IL", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
              });

        newsHtml += `
          <div class="news-item">
            <span class="news-time">${timeStr}</span>
            <span>${title}</span>
          </div>
        `;

      }

    });

    document.getElementById("ticker").innerHTML =
      newsHtml;

  } catch (error) {

    console.error(error);

  }

}

updateClock();
updateCountdown();
loadNews();

setInterval(updateClock, 1000);
setInterval(updateCountdown, 1000);
setInterval(loadNews, 120000);
setInterval(refreshSheet, 20000);

</script>

</body>
</html>
